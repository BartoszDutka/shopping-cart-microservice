services:
  api:
    build:
      context: .
      dockerfile: src/NotificationSystem.Api/Dockerfile
    ports:
      - "5173:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__MongoDB=${MONGODB_URI:?Set MONGODB_URI}
      - MongoDbSettings__DatabaseName=ZtpLab1DevDb
      - MongoDbSettings__CollectionName=Notifications

  worker-email:
    build:
      context: .
      dockerfile: src/NotificationSystem.Worker.Email/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ApiUrl=http://api:8080
    depends_on:
      - api

  worker-push:
    build:
      context: .
      dockerfile: src/NotificationSystem.Worker.Push/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ApiUrl=http://api:8080
    depends_on:
      - api
